<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Truck Overlay PRO</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent !important;
            color: #32CD32;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 2px 2px 2px #000;
            overflow: hidden;
        }
        #container {
            position: absolute;
            bottom: 20px;
            left: 20px;
        }
        #greeting-box {
            color: #FFD700;
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            margin-bottom: 5px;
        }
        .timestamp {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 5px;
        }
        #weather-line {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        #fuel-line {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #moon-line {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
        }
        #moon-emoji {
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="greeting-box">🚛 <span id="greeting-text">Welcome In Mother Truckers</span></div>
        <div class="timestamp" id="datetime"></div>
        <div id="weather-line"><span id="temp-display">Searching GPS...</span></div>
        <div id="fuel-line">⛽ Nat'l Diesel Avg: <span id="diesel-price">$4.951</span></div>
        <div id="moon-line">
            <span id="moon-emoji"></span>
            <span id="moon-desc"></span>
        </div>
    </div>

    <script>
        const CONFIG = {
            W_REF: 600000, 
            C_REF: 1000, 
            F_REF: 43200000, // 12 Hour Refresh
            L_EPOCH: new Date('2026-02-17T12:01:00Z'),
            MONTH: 29.530588 * 24 * 60 * 60 * 1000 
        };

        function getNthDay(year, month, dayOfWeek, n) {
            let date = new Date(year, month, 1);
            let add = (dayOfWeek - date.getDay() + 7) % 7 + (n - 1) * 7;
            return date.getDate() + add;
        }

        function getHolidayGreeting(now) {
            const y = now.getFullYear();
            const m = now.getMonth();
            const d = now.getDate();
            const dateKey = `${m + 1}-${d}`;
            
            const fixed = {
                "1-1": "Happy New Year! 🎆",
                "2-14": "Happy Valentine's Day! ❤️",
                "3-17": "Happy St. Paddy's Day! ☘️",
                "5-8": "V-E Day! ✌️",
                "6-14": "Army Birthday & Flag Day! 🇺🇸",
                "6-28": "National Logistics Day! 📦",
                "7-4": "Happy 4th of July! 🇺🇸🎆",
                "8-4": "Happy Birthday Coast Guard! ⚓",
                "8-31": "National Roadside Assistance Day! 🛠️",
                "9-2": "V-J Day! ⚓",
                "9-11": "Patriot Day - Never Forget 🇺🇸",
                "9-18": "Happy Birthday USAF! ✈️",
                "10-13": "Happy Birthday US Navy! ⚓",
                "10-31": "Happy Halloween! 🎃",
                "11-10": "Happy Birthday Marine Corps! 🦅",
                "11-11": "Thank You Veterans! 🎖️",
                "12-13": "Happy Birthday National Guard! 🛡️",
                "12-20": "Happy Birthday Space Force! 🚀",
                "12-24": "Merry Christmas Eve! 🎅",
                "12-25": "Merry Christmas! 🎄",
                "12-31": "Happy New Year's Eve! 🥂"
            };

            if (fixed[dateKey]) return fixed[dateKey];

            // Calculated Holidays
            if (m === 4) { // May
                if (d === getNthDay(y, 4, 0, 2)) return "Happy Mother's Day! 🌸";
                if (d === getNthDay(y, 4, 6, 3)) return "Armed Forces Day! 🎖️";
                let lastMon = new Date(y, 5, 0);
                lastMon.setDate(lastMon.getDate() - ((lastMon.getDay() + 6) % 7));
                if (d === lastMon.getDate()) return "Happy Memorial Day! 🇺🇸";
            }
            if (m === 5 && d === getNthDay(y, 5, 0, 3)) return "Happy Father's Day! 🧢";
            
            // Truck Driver Appreciation Week (Full Week Logic)
            if (m === 8) { // September
                if (d === getNthDay(y, 8, 1, 1)) return "Happy Labor Day! 🛠️";
                let startWeek = getNthDay(y, 8, 0, 2); 
                if (d >= startWeek && d <= (startWeek + 6)) return "National Truck Driver Appreciation Week! 🏆";
            }

            if (m === 10 && d === getNthDay(y, 10, 4, 4)) return "Happy Thanksgiving! 🦃";

            return "Welcome In Mother Truckers";
        }

        async function fetchDiesel() {
            try {
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.gasbuddy.com/usa'));
                const data = await response.json();
                const match = data.contents.match(/Diesel.*?\$(\d\.\d{3})/s);
                if (match) {
                    document.getElementById('diesel-price').innerText = "$" + match[1];
                }
            } catch (e) {
                document.getElementById('diesel-price').innerText = "$4.951";
            }
        }

        function updateTime() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const year = now.getFullYear();
            const dateStr = month + "/" + day + "/" + year;
            const timeStr = now.toLocaleTimeString([], { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            document.getElementById('datetime').innerText = dateStr + " " + timeStr;
            document.getElementById('greeting-text').innerText = getHolidayGreeting(now);
        }

        async function fetchWeather() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`);
                    const data = await res.json();
                    if (data.current) {
                        const temp = Math.round(data.current.temperature_2m);
                        const lookup = { 0: "Clear", 1: "Mainly Clear", 2: "Partly Cloudy", 3: "Overcast", 45: "Foggy", 61: "Rainy", 71: "Snowy" };
                        const desc = lookup[data.current.weather_code] || "Cloudy";
                        document.getElementById('temp-display').innerText = temp + "°F - " + desc;
                    }
                } catch (e) {}
            });
        }

        function updateMoon() {
            const diff = (new Date().getTime() - CONFIG.L_EPOCH.getTime()) % CONFIG.MONTH;
            const phase = diff / CONFIG.MONTH;
            let icon, desc;
            if (phase < 0.03) { icon = "🌑"; desc = "New Moon"; }
            else if (phase < 0.22) { icon = "🌒"; desc = "Waxing Crescent"; }
            else if (phase < 0.30) { icon = "🌓"; desc = "First Quarter"; }
            else if (phase < 0.47) { icon = "🌔"; desc = "Waxing Gibbous"; }
            else if (phase < 0.53) { icon = "🌕"; desc = "Full Moon"; }
            else if (phase < 0.72) { icon = "🌖"; desc = "Waning Gibbous"; }
            else if (phase < 0.78) { icon = "🌗"; desc = "Last Quarter"; }
            else { icon = "🌘"; desc = "Waning Crescent"; }
            document.getElementById('moon-emoji').innerText = icon;
            document.getElementById('moon-desc').innerText = desc;
        }

        updateTime();
        updateMoon();
        fetchWeather();
        fetchDiesel();

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, CONFIG.W_REF);
        setInterval(fetchDiesel, CONFIG.F_REF);
    </script>
</body>
</html>
