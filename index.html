<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Truck Overlay - Mother Trucker Edition</title>
  <style>
    /* SHARPNESS & CLARITY SETTINGS */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #32CD32; /* Lime Green */
      
      /* HARD STROKE - Kills the fuzzy mobile rendering */
      text-shadow: 
        -1px -1px 0 #000,  
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         2px  2px 1px rgba(0,0,0,1);

      -webkit-font-smoothing: antialiased;
      transform: translateZ(0);
      text-rendering: optimizeLegibility;
    }

    #container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      line-height: 1.1;
      pointer-events: none;
    }

    #greeting-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      color: #FFD700; /* Gold */
      margin-bottom: 8px;
      font-weight: 900;
      font-style: italic;
    }

    .timestamp {
      font-weight: 900;
      font-size: 30px;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    #weather-container {
      font-size: 22px;
      margin-bottom: 5px;
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: bold;
    }

    /* Temp Alert Colors */
    .temp-cold { color: #00BFFF; animation: sharpPulse 2s infinite; }
    .temp-hot { color: #FF4500; animation: sharpPulse 2s infinite; }

    @keyframes sharpPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    #moon-line {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    #moon-emoji { font-size: 36px; }
  </style>
</head>
<body>

  <div id="container">
    <div id="greeting-box">
      <span id="greeting-display"></span>
    </div>
    <div class="timestamp" id="datetime">00/00/0000 00:00:00</div>
    <div id="weather-container">
      <span id="weather-icon"></span>
      <span id="temp-display">SYNCING...</span>
      <span id="weather-details"></span>
    </div>
    <div id="moon-line">
      <span id="moon-emoji"></span>
      <span id="moon-desc"></span>
    </div>
  </div>

  <script>
    // 1. HOLIDAY DATE HELPER
    function getNthDay(year, month, dayOfWeek, n) {
      let date = new Date(year, month, (n > 0 ? 1 : 0));
      if (n > 0) {
        while (date.getDay() !== dayOfWeek) date.setDate(date.getDate() + 1);
        date.setDate(date.getDate() + (n - 1) * 7);
      } else {
        date = new Date(year, month + 1, 0);
        while (date.getDay() !== dayOfWeek) date.setDate(date.getDate() - 1);
      }
      return date;
    }

    // 2. GREETING & HOLIDAY LOGIC
    function getGreeting(now) {
      const y = now.getFullYear(); const m = now.getMonth(); const d = now.getDate();
      
      const hData = {
        '0-1': { name: "New Year's Day", icon: "✦" },
        '1-14': { name: "Valentine's Day", icon: "❤" },
        '2-17': { name: "St. Patrick's Day", icon: "☘" },
        '6-4': { name: "Independence Day", icon: "✷" },
        '9-31': { name: "Halloween", icon: "☠" },
        '10-11': { name: "Veterans Day", icon: "✪" },
        '11-25': { name: "Christmas Day", icon: "🎄" },
        '11-31': { name: "New Year's Eve", icon: "🎆" }
      };

      let holiday = hData[`${m}-${d}`] || null;

      // Dynamic Holidays
      const mothersDay = getNthDay(y, 4, 0, 2);
      const fathersDay = getNthDay(y, 5, 0, 3);
      const memDay = getNthDay(y, 4, 1, -1);
      const laborDay = getNthDay(y, 8, 1, 1);
      const thanksGiving = getNthDay(y, 10, 4, 4);
      const tawStart = getNthDay(y, 8, 0, 2);
      const tawEnd = new Date(tawStart); tawEnd.setDate(tawStart.getDate() + 6);

      if (m === mothersDay.getMonth() && d === mothersDay.getDate()) holiday = { name: "Mother's Day", icon: "✿" };
      if (m === fathersDay.getMonth() && d === fathersDay.getDate()) holiday = { name: "Father's Day", icon: "⚓" };
      if (m === memDay.getMonth() && d === memDay.getDate()) holiday = { name: "Memorial Day", icon: "✪" };
      if (m === laborDay.getMonth() && d === laborDay.getDate()) holiday = { name: "Labor Day", icon: "⚙" };
      if (m === thanksGiving.getMonth() && d === thanksGiving.getDate()) holiday = { name: "Thanksgiving", icon: "🦃" };
      if (now >= tawStart && now <= tawEnd) holiday = { name: "Trucker Appreciation", icon: "🚛" };

      if (holiday) {
        return `${holiday.icon} Wishing viewers a Happy ${holiday.name}`;
      }
      
      // DEFAULT GREETING
      return "🚛 Welcome In Mother Truckers"; 
    }

    // 3. CLOCK UPDATE
    function updateClock() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('datetime').innerText = `${month}/${day}/${year} ${h}:${m}:${s}`;
      document.getElementById('greeting-display').innerText = getGreeting(now);
    }
    setInterval(updateClock, 1000); updateClock();

    // 4. WEATHER FETCH (CURL SPOOF)
    function fetchWeather(location) {
      const url = `https://wttr.in/${location}?format=%c|%t|%h|%w|%p&u&m`;
      fetch(url, { headers: { "User-Agent": "curl" } })
        .then(r => r.text())
        .then(text => {
          let parts = text.replace(/"/g, '').split('|');
          if (parts.length < 2) return;
          let rawTemp = parts[1].trim().replace('°F', '').replace('+', '');
          let tempNum = parseInt(rawTemp);
          let details = `${parts[2]} ${parts[3]} ${parts[4]}`.replace(/mm/g, '').replace(/\s+/g, ' ').trim();

          const tempEl = document.getElementById('temp-display');
          tempEl.innerText = `${rawTemp}°F`;
          tempEl.className = ''; 
          if (tempNum <= 32) tempEl.classList.add('temp-cold');
          else if (tempNum >= 90) tempEl.classList.add('temp-hot');

          document.getElementById('weather-icon').innerText = parts[0].trim();
          document.getElementById('weather-details').innerText = details;
        })
        .catch(() => {
          document.getElementById('temp-display').innerText = "RECONNECTING...";
          setTimeout(() => initWeather(), 30000);
        });
    }

    function initWeather() {
      const fallback = "Dallas"; 
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (p) => fetchWeather(`${p.coords.latitude.toFixed(4)},${p.coords.longitude.toFixed(4)}`),
          () => fetchWeather(fallback),
          { timeout: 8000 }
        );
      } else { fetchWeather(fallback); }
    }
    initWeather(); setInterval(initWeather, 900000);

    // 5. MOON PHASE
    function getMoonPhase() {
      const now = new Date();
      const jd = (now.getTime() / 86400000) + 2440587.5;
      const newMoonRef = 2451550.1; const lunarCycle = 29.53058867;
      let phase = ((jd - newMoonRef) % lunarCycle) / lunarCycle;
      if (phase < 0) phase += 1;
      let emoji, desc;
      if (phase < 0.03 || phase > 0.97) { emoji = '🌑'; desc = 'New Moon'; }
      else if (phase < 0.22) { emoji = '🌒'; desc = 'Waxing Crescent'; }
      else if (phase < 0.28) { emoji = '🌓'; desc = 'First Quarter'; }
      else if (phase < 0.47) { emoji = '🌔'; desc = 'Waxing Gibbous'; }
      else if (phase < 0.53) { emoji = '🌕'; desc = 'Full Moon'; }
      else if (phase < 0.72) { emoji = '🌖'; desc = 'Waning Gibbous'; }
      else if (phase < 0.78) { emoji = '🌗'; desc = 'Last Quarter'; }
      else { emoji = '🌘'; desc = 'Waning Crescent'; }
      document.getElementById('moon-emoji').innerText = emoji;
      document.getElementById('moon-desc').innerText = desc;
    }
    getMoonPhase(); setInterval(getMoonPhase, 900000);
  </script>
</body>
</html>
