<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Truck Weather Overlay - IRL Pro Mobile</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #32CD32;
      /* Heavy shadow for visibility against road/sky backgrounds */
      text-shadow: 2px 2px 4px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.8);
    }

    #container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      line-height: 1.1;
      pointer-events: none;
    }

    #holiday-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px; /* Slightly larger for mobile visibility */
      color: #FFD700; /* Gold text for holiday name */
      margin-bottom: 6px;
      font-weight: bold;
    }

    .timestamp {
      font-weight: bold;
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    #weather-container {
      font-size: 22px;
      margin-bottom: 5px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Temp Alert Pulsing */
    .temp-cold { color: #00BFFF; animation: tempPulse 2s infinite; }
    .temp-hot { color: #FF4500; animation: tempPulse 2s infinite; }

    @keyframes tempPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    #moon-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #moon-emoji { font-size: 40px; }
    #moon-desc { font-size: 20px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="container">
    <div id="holiday-box">
      <span id="holiday-icon"></span>
      <span id="holiday-name"></span>
    </div>
    <div class="timestamp" id="datetime">00/00/0000 00:00:00</div>
    <div id="weather-container">
      <span id="weather-icon"></span>
      <span id="temp-display">SYNCING...</span>
      <span id="weather-details"></span>
    </div>
    <div id="moon-line">
      <span id="moon-emoji"></span>
      <span id="moon-desc"></span>
    </div>
  </div>

  <script>
    function getNthDay(year, month, dayOfWeek, n) {
      let date = new Date(year, month, (n > 0 ? 1 : 0));
      if (n > 0) {
        while (date.getDay() !== dayOfWeek) date.setDate(date.getDate() + 1);
        date.setDate(date.getDate() + (n - 1) * 7);
      } else {
        date = new Date(year, month + 1, 0);
        while (date.getDay() !== dayOfWeek) date.setDate(date.getDate() - 1);
      }
      return date;
    }

    function getHolidayData(now) {
      const y = now.getFullYear();
      const m = now.getMonth();
      const d = now.getDate();
      
      const hData = {
        '0-1': { name: "New Year's Day", icon: "✦" },
        '1-14': { name: "Valentine's Day", icon: "❤" },
        '2-17': { name: "St. Patrick's Day", icon: "☘" },
        '6-4': { name: "Independence Day", icon: "✷" },
        '9-31': { name: "Halloween", icon: "☠" },
        '10-11': { name: "Veterans Day", icon: "✪" },
        '11-25': { name: "Christmas Day", icon: "🎄" },
        '11-31': { name: "New Year's Eve", icon: "🎆" }
      };

      let result = hData[`${m}-${d}`] || { name: "", icon: "" };

      const mothersDay = getNthDay(y, 4, 0, 2);
      const fathersDay = getNthDay(y, 5, 0, 3);
      const memDay = getNthDay(y, 4, 1, -1);
      const laborDay = getNthDay(y, 8, 1, 1);
      const thanksGiving = getNthDay(y, 10, 4, 4);
      const tawStart = getNthDay(y, 8, 0, 2); 
      const tawEnd = new Date(tawStart); tawEnd.setDate(tawStart.getDate() + 6);

      if (m === mothersDay.getMonth() && d === mothersDay.getDate()) result = { name: "Mother's Day", icon: "✿" };
      if (m === fathersDay.getMonth() && d === fathersDay.getDate()) result = { name: "Father's Day", icon: "⚓" };
      if (m === memDay.getMonth() && d === memDay.getDate()) result = { name: "Memorial Day", icon: "✪" };
      if (m === laborDay.getMonth() && d === laborDay.getDate()) result = { name: "Labor Day", icon: "⚙" };
      if (m === thanksGiving.getMonth() && d === thanksGiving.getDate()) result = { name: "Thanksgiving", icon: "🦃" };
      if (now >= tawStart && now <= tawEnd) result = { name: "Trucker Appreciation", icon: "🚛" };

      return result;
    }

    function updateTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('datetime').innerText = `${month}/${day}/${year} ${h}:${m}:${s}`;
      const holiday = getHolidayData(now);
      document.getElementById('holiday-name').innerText = holiday.name;
      document.getElementById('holiday-icon').innerText = holiday.icon;
    }
    setInterval(updateTime, 1000);
    updateTime();

    function getMoonPhase() {
      const now = new Date();
      const jd = (now.getTime() / 86400000) + 2440587.5;
      const newMoonRef = 2451550.1; 
      const lunarCycle = 29.53058867;
      let phase = ((jd - newMoonRef) % lunarCycle) / lunarCycle;
      if (phase < 0) phase += 1;

      let emoji, desc;
      if (phase < 0.03 || phase > 0.97) { emoji = '🌑'; desc = 'New Moon'; }
      else if (phase < 0.22) { emoji = '🌒'; desc = 'Waxing Crescent'; }
      else if (phase < 0.28) { emoji = '🌓'; desc = 'First Quarter'; }
      else if (phase < 0.47) { emoji = '🌔'; desc = 'Waxing Gibbous'; }
      else if (phase < 0.53) { emoji = '🌕'; desc = 'Full Moon'; }
      else if (phase < 0.72) { emoji = '🌖'; desc = 'Waning Gibbous'; }
      else if (phase < 0.78) { emoji = '🌗'; desc = 'Last Quarter'; }
      else { emoji = '🌘'; desc = 'Waning Crescent'; }

      document.getElementById('moon-emoji').innerText = emoji;
      document.getElementById('moon-desc').innerText = desc;
    }
    getMoonPhase();
    setInterval(getMoonPhase, 900000);

    function fetchWeather(query) {
      const url = `https://wttr.in/${query}?format="%c|%t|%h|%w|%p"&u`;
      fetch(url).then(r => r.text()).then(text => {
        let parts = text.replace(/"/g, '').split('|');
        if(parts.length < 2) return;
        let rawTemp = parts[1].trim().replace('°F', '').replace('+', '');
        let tempNum = parseInt(rawTemp);
        // Scrubber to kill "mm", extra spaces, and keep it one line
        let details = `${parts[2]} ${parts[3]} ${parts[4]}`.replace(/mm/g, '').replace(/\s+/g, ' ').trim();

        const tempEl = document.getElementById('temp-display');
        tempEl.innerText = `${rawTemp}°F`;
        tempEl.className = ''; 
        if (tempNum <= 32) tempEl.classList.add('temp-cold');
        else if (tempNum >= 90) tempEl.classList.add('temp-hot');

        document.getElementById('weather-icon').innerText = parts[0].trim();
        document.getElementById('weather-details').innerText = details;
      }).catch(() => {
        document.getElementById('temp-display').innerText = 'OFFLINE';
        setTimeout(() => fetchWeather(query), 20000);
      });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => fetchWeather(`${p.coords.latitude.toFixed(4)},${p.coords.longitude.toFixed(4)}`),
        () => fetchWeather('')
      );
    } else { fetchWeather(''); }
  </script>
</body>
</html>
