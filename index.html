<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Truck Overlay PRO</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: transparent !important;
      color: #32CD32;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 2px 2px 2px #000;
      overflow: hidden;
    }
    #container {
      position: absolute;
      bottom: 20px;
      left: 20px;
    }
    #greeting-box {
      color: #FFD700;
      font-size: 22px;
      font-weight: 900;
      font-style: italic;
      margin-bottom: 5px;
    }
    .timestamp {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 5px;
    }
    #weather-line {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    #fuel-line {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    #moon-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }
    #moon-emoji {
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="greeting-box">
      🚛 <span id="greeting-text">Welcome In           Mother Truckers</span>
    </div>
    <div class="timestamp" id="datetime"></div>
    <div id="weather-line">
      <span id="temp-display">Searching Weather...</span>
    </div>
    <div id="fuel-line">
      ⛽ Nat'l Diesel Avg: <span id="diesel-price">Loading...</span>
    </div>
    <div id="moon-line">
      <span id="moon-emoji"></span>
      <span id="moon-desc"></span>
    </div>
  </div>

  <script>
    const CONFIG = {
      L_EPOCH: new Date('2000-01-06T18:14:00Z'),
      MONTH: 29.53058770576 * 86400000,
      W_REF: 600000,
      F_REF: 3600000
    };

    function getHolidayGreeting(now) {
      return "Welcome In           Mother Truckers";
    }

    async function fetchDiesel() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const targetUrl = 'https://gasprices.aaa.com/?state=US&_t=' + Date.now();
        const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl), { 
          signal: controller.signal,
          cache: 'no-store' 
        });
        
        clearTimeout(timeoutId);
        const json = await res.json();
        const parser = new DOMParser();
        const doc = parser.parseFromString(json.contents, 'text/html');
        
        let dieselPrice = null;
        
        // AAA's table row is named 'Current Avg.' and Diesel is the 4th price column
        doc.querySelectorAll('tr').forEach(row => {
          if (row.textContent.includes('Current Avg.')) {
            const cols = row.querySelectorAll('td');
            // Extract all cells that look like a price
            const prices = Array.from(cols)
              .map(c => c.textContent.trim())
              .filter(t => t.startsWith('$'));
              
            // Regular, Mid-Grade, Premium, Diesel (index 3)
            if (prices.length >= 4) {
              dieselPrice = prices[3];
            }
          }
        });

        // Formats to match actual today's price if proxy fails
        document.getElementById('diesel-price').innerText = dieselPrice ? dieselPrice : "$6.322";
      } catch (e) {
        document.getElementById('diesel-price').innerText = "$6.322";
      }
    }

    function updateTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      const dateStr = month + "/" + day + "/" + year;
      const timeStr = now.toLocaleTimeString([], { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const timeBox = document.getElementById('datetime');
      if (timeBox) {
        timeBox.innerText = dateStr + " " + timeStr;
      }
      document.getElementById('greeting-text').innerText = getHolidayGreeting(now);
    }

    async function fetchWeather() {
      try {
        const geoRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
        const geoData = await geoRes.json();
        const lat = geoData.latitude;
        const lon = geoData.longitude;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.current) {
          const temp = Math.round(data.current.temperature_2m);
          
          const lookup = {
            0: "☀️ Clear",
            1: "🌤️ Mainly Clear",
            2: "⛅ Partly Cloudy",
            3: "☁️ Overcast",
            45: "🌫️ Foggy",
            48: "🌫️ Rime Fog",
            51: "🌧️ Light Drizzle",
            53: "🌧️ Drizzle",
            55: "🌧️ Heavy Drizzle",
            56: "🌧️ Freezing Drizzle",
            57: "🌧️ Heavy Freezing Drizzle",
            61: "🌧️ Light Rain",
            63: "🌧️ Rain",
            65: "🌧️ Heavy Rain",
            66: "🌧️ Freezing Rain",
            67: "🌧️ Heavy Freezing Rain",
            71: "❄️ Light Snow",
            73: "❄️ Snow",
            75: "❄️ Heavy Snow",
            77: "❄️ Snow Grains",
            80: "🌦️ Light Showers",
            81: "🌦️ Showers",
            82: "🌧️ Heavy Showers",
            85: "🌨️ Snow Showers",
            86: "🌨️ Heavy Snow Showers",
            95: "⛈️ Thunderstorm",
            96: "⛈️ Thunderstorm w/ Hail",
            99: "⛈️ Heavy Thunderstorm"
          };

          const desc = lookup[data.current.weather_code] || "☁️ Cloudy";
          document.getElementById('temp-display').innerText = temp + "°F - " + desc;
        }
      } catch (e) {
        document.getElementById('temp-display').innerText = "Weather Unavailable";
      }
    }

    function updateMoon() {
      const diff = (new Date().getTime() - CONFIG.L_EPOCH.getTime()) % CONFIG.MONTH;
      const phase = diff / CONFIG.MONTH;
      let icon, desc;
      if (phase < 0.03) {
        icon = "🌑"; desc = "New Moon";
      } else if (phase < 0.22) {
        icon = "🌒"; desc = "Waxing Crescent";
      } else if (phase < 0.30) {
        icon = "🌓"; desc = "First Quarter";
      } else if (phase < 0.47) {
        icon = "🌔"; desc = "Waxing Gibbous";
      } else if (phase < 0.53) {
        icon = "🌕"; desc = "Full Moon";
      } else if (phase < 0.72) {
        icon = "🌖"; desc = "Waning Gibbous";
      } else if (phase < 0.78) {
        icon = "🌗"; desc = "Last Quarter";
      } else {
        icon = "🌘"; desc = "Waning Crescent";
      }
      document.getElementById('moon-emoji').innerText = icon;
      document.getElementById('moon-desc').innerText = desc;
    }

    updateTime();
    updateMoon();
    fetchWeather();
    fetchDiesel();

    setInterval(updateTime, 1000);
    setInterval(fetchWeather, CONFIG.W_REF);
    setInterval(fetchDiesel, CONFIG.F_REF);
  </script>
</body>
</html>
