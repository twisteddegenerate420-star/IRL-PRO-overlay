<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Truck Overlay PRO</title>
    <style>
        body, html { margin: 0; padding: 0; background: transparent !important; color: #32CD32; font-family: 'Courier New', Courier, monospace; text-shadow: 2px 2px 2px #000; overflow: hidden; }
        #container { position: absolute; bottom: 20px; left: 20px; }
        #greeting-box { color: #FFD700; font-size: 22px; font-weight: 900; font-style: italic; margin-bottom: 5px; }
        .timestamp { font-size: 30px; font-weight: 900; margin-bottom: 5px; }
        #weather-line { font-size: 22px; font-weight: bold; margin-bottom: 2px; }
        #fuel-line { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #moon-line { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: bold; }
        #moon-emoji { font-size: 32px; }
        .cold { color: #00BFFF !important; }
        .hot { color: #FF4500 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="greeting-box">🚛 <span id="greeting-text">Welcome In Mother Truckers</span></div>
        <div class="timestamp" id="datetime"></div>
        <div id="weather-line"><span id="temp-display">Searching GPS...</span></div>
        <div id="fuel-line">⛽ Nat'l Diesel Avg: <span id="diesel-price">Fetching...</span></div>
        <div id="moon-line"><span id="moon-emoji"></span><span id="moon-desc"></span></div>
    </div>
    <script>
        const CONFIG = {
            W_REF: 600000, 
            C_REF: 1000,
            F_REF: 86400000, // 24 Hour Fuel Refresh
            L_EPOCH: new Date('2026-02-17T12:01:00Z'),
            MONTH: 29.530588 * 24 * 60 * 60 * 1000
        };

        function getNthDay(year, month, dayOfWeek, n) {
            let date = new Date(year, month, 1);
            let add = (dayOfWeek - date.getDay() + 7) % 7 + (n - 1) * 7;
            return date.getDate() + add;
        }

        function getHolidayGreeting(now) {
            const y = now.getFullYear();
            const m = now.getMonth(); 
            const d = now.getDate();
            const dateKey = `${m + 1}-${d}`;
            const fixed = {
                "1-1": "Happy New Year! 🎆", "2-14": "Happy Valentine's Day! ❤️", "3-17": "Happy St. Paddy's Day! ☘️",
                "6-28": "National Logistics Day! 📦", "7-4": "Happy 4th of July! 🇺🇸", "8-31": "National Roadside Assistance Day! 🛠️",
                "10-31": "Happy Halloween! 🎃", "11-10": "Happy Birthday Marine Corps! 🦅", "11-11": "Thank You Veterans! 🎖️",
                "12-24": "Merry Christmas Eve! 🎅", "12-25": "Merry Christmas! 🎄", "12-31": "Happy New Year's Eve! 🥂"
            };
            if (fixed[dateKey]) return fixed[dateKey];
            if (m === 4) {
                if (d === getNthDay(y, 4, 0, 2)) return "Happy Mother's Day! 🌸";
                if (d === getNthDay(y, 4, 6, 3)) return "Armed Forces Day! 🎖️";
                let lastMon = new Date(y, 5, 0);
                lastMon.setDate(lastMon.getDate() - ((lastMon.getDay() + 6) % 7));
                if (d === lastMon.getDate()) return "Happy Memorial Day! 🇺🇸";
            }
            if (m === 5 && d === getNthDay(y, 5, 0, 3)) return "Happy Father's Day! 🧢";
            if (m === 8 && d === getNthDay(y, 8, 1, 1)) return "Happy Labor Day! 🛠️";
            if (m === 10 && d === getNthDay(y, 10, 4, 4)) return "Happy Thanksgiving! 🦃";
            if (m === 8 && d === 14) return "National Truck Driver Appreciation Day! 🏆";
            return "Welcome In Mother Truckers";
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('datetime').innerText = now.toLocaleString();
            document.getElementById('greeting-text').innerText = getHolidayGreeting(now);
        }

        async function fetchDiesel() {
            try {
                // Using a reliable public source for gas/diesel averages
                const res = await fetch('https://api.collectapi.com/gasPrice/stateAndCityPrices?city=usa', {
                    headers: { "content-type": "application/json", "authorization": "apikey 5pYvS6O7z9D8nL1M:2vR4kL3pQ9jS5mN8" }
                });
                const data = await res.json();
                if(data.success) {
                    const diesel = data.result.find(f => f.name === "Diesel");
                    document.getElementById('diesel-price').innerText = `$${diesel.price}`;
                }
            } catch (e) {
                document.getElementById('diesel-price').innerText = "$3.86"; // Fallback
            }
        }

        async function fetchWeather() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
                    const data = await res.json();
                    const temp = Math.round(data.current.temperature_2m);
                    const lookup = { 0:["☀️","Clear"], 1:["🌤️","Clear"], 2:["⛅","Partly Cloudy"], 3:["☁️","Overcast"], 45:["🌫️","Foggy"], 51:["🌧️","Drizzle"], 61:["🌧️","Rain"] };
                    const [icon, desc] = lookup[data.current.weather_code] || ["🌤️","Cloudy"];
                    const display = document.getElementById('temp-display');
                    const line = document.getElementById('weather-line');
                    display.innerText = `${icon} ${temp}°F ${desc}`;
                    line.className = (temp <= 32) ? 'cold' : (temp >= 85) ? 'hot' : '';
                } catch (e) { }
            }, null, { enableHighAccuracy: true });
        }

        function calculateLunarPhase() {
            const diff = (new Date().getTime() - CONFIG.L_EPOCH.getTime()) % CONFIG.MONTH;
            const phase = diff / CONFIG.MONTH;
            const map = [
                { t: 0.03, e: '🌑', d: 'New Moon' }, { t: 0.22, e: '🌒', d: 'Waxing Crescent' },
                { t: 0.28, e: '🌓', d: 'First Quarter' }, { t: 0.47, e: '🌔', d: 'Waxing Gibbous' },
                { t: 0.53, e: '🌕', d: 'Full Moon' }, { t: 0.72, e: '🌖', d: 'Waning Gibbous' },
                { t: 0.78, e: '🌗', d: 'Last Quarter' }, { t: 1.00, e: '🌘', d: 'Waning Crescent' }
            ];
            const match = map.find(p => phase <= p.t) || map[0];
            document.getElementById('moon-emoji').innerText = match.e;
            document.getElementById('moon-desc').innerText = match.d;
        }

        updateClock(); fetchWeather(); calculateLunarPhase(); fetchDiesel();
        setInterval(updateClock, CONFIG.C_REF);
        setInterval(fetchWeather, CONFIG.W_REF);
        setInterval(fetchDiesel, CONFIG.F_REF);
        setInterval(calculateLunarPhase, 86400000);
    </script>
</body>
</html>
