<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Truck Weather Overlay - Dynamic Float</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #32CD32;
      text-shadow: 2px 2px 4px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.8);
    }

    #container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: transparent;
      line-height: 1.2;
      pointer-events: none;
    }

    .timestamp {
      font-weight: bold;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    #weather-container {
      font-size: 22px;
      margin-bottom: 5px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Dynamic Temp Classes */
    .temp-normal { color: #32CD32; }
    .temp-cold { color: #00BFFF; animation: tempPulse 2s infinite ease-in-out; }
    .temp-hot { color: #FF4500; animation: tempPulse 2s infinite ease-in-out; }

    @keyframes tempPulse {
      0% { opacity: 1; text-shadow: 0 0 5px currentColor; }
      50% { opacity: 0.7; text-shadow: 0 0 15px currentColor; }
      100% { opacity: 1; text-shadow: 0 0 5px currentColor; }
    }

    #moon-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #moon-emoji { font-size: 40px; }
    #moon-desc { font-size: 20px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="container">
    <div class="timestamp" id="datetime">00/00/0000 00:00:00</div>
    <div id="weather-container">
      <span id="weather-icon"></span>
      <span id="temp-display">SYNCING...</span>
      <span id="weather-details"></span>
    </div>
    <div id="moon-line">
      <span id="moon-emoji"></span>
      <span id="moon-desc"></span>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('datetime').innerText = `${month}/${day}/${year} ${h}:${m}:${s}`;
    }
    setInterval(updateTime, 1000);
    updateTime();

    function getMoonPhase() {
      const now = new Date();
      const jd = (now.getTime() / 86400000) + 2440587.5;
      const newMoonRef = 2451550.1; 
      const lunarCycle = 29.53058867;
      let phase = ((jd - newMoonRef) % lunarCycle) / lunarCycle;
      if (phase < 0) phase += 1;

      let emoji, desc;
      if (phase < 0.03 || phase > 0.97) { emoji = '🌑'; desc = 'New Moon'; }
      else if (phase < 0.22) { emoji = '🌒'; desc = 'Waxing Crescent'; }
      else if (phase < 0.28) { emoji = '🌓'; desc = 'First Quarter'; }
      else if (phase < 0.47) { emoji = '🌔'; desc = 'Waxing Gibbous'; }
      else if (phase < 0.53) { emoji = '🌕'; desc = 'Full Moon'; }
      else if (phase < 0.72) { emoji = '🌖'; desc = 'Waning Gibbous'; }
      else if (phase < 0.78) { emoji = '🌗'; desc = 'Last Quarter'; }
      else { emoji = '🌘'; desc = 'Waning Crescent'; }

      document.getElementById('moon-emoji').innerText = emoji;
      document.getElementById('moon-desc').innerText = desc;
    }
    getMoonPhase();
    setInterval(getMoonPhase, 900000);

    function fetchWeather(query) {
      const url = `https://wttr.in/${query}?format="%c|%t|%h|%w|%p"&u`;

      fetch(url)
        .then(r => r.text())
        .then(text => {
          let parts = text.replace(/"/g, '').split('|');
          if(parts.length < 2) return;

          let icon = parts[0].trim();
          let rawTemp = parts[1].trim().replace('°F', '').replace('+', '');
          let tempNum = parseInt(rawTemp);
          let details = `${parts[2]} ${parts[3]} ${parts[4]}`.replace(/mm/g, '').trim();

          const tempEl = document.getElementById('temp-display');
          
          // Apply Temperature Styles
          tempEl.innerText = `${rawTemp}°F`;
          tempEl.className = ''; // reset
          if (tempNum <= 32) tempEl.classList.add('temp-cold');
          else if (tempNum >= 90) tempEl.classList.add('temp-hot');
          else tempEl.classList.add('temp-normal');

          document.getElementById('weather-icon').innerText = icon;
          document.getElementById('weather-details').innerText = details;
        })
        .catch(() => {
          document.getElementById('temp-display').innerText = 'RECONNECTING...';
          setTimeout(() => fetchWeather(query), 15000);
        });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => fetchWeather(`${p.coords.latitude.toFixed(4)},${p.coords.longitude.toFixed(4)}`),
        () => fetchWeather('')
      );
    } else {
      fetchWeather('');
    }
  </script>
</body>
</html>
