<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Truck Weather Overlay - Lime Green</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #32CD32;
      text-shadow: 0 0 4px black, 0 0 8px black;
    }
    #container {
      position: absolute;
      bottom: 10px;
      left: 10px;
      padding: 6px 10px;
      background: transparent;
      font-size: 22px;
      line-height: 1.4;
      pointer-events: none;
      white-space: nowrap;
    }
    .timestamp {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 24px;
    }
    #weather {
      margin-top: 4px;
    }
    #moon-line {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 26px;
    }
    #moon-emoji {
      font-size: 36px;
    }
    #moon-desc {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="timestamp" id="datetime">Loading time...</div>
    <div id="weather">Loading weather...</div>
    <div id="moon-line">
      <span id="moon-emoji"></span>
      <span id="moon-desc"></span>
    </div>
  </div>

  <script>
    // Ticking time
    function updateTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('datetime').innerText = month + '/' + day + '/' + year + ' ' + hours + ':' + minutes + ':' + seconds;
    }

    setInterval(updateTime, 1000);
    updateTime();

    // High-Precision Moon Phase Calculation
    function getMoonPhase() {
      const now = new Date();
      
      // Calculate Julian Date from current Unix timestamp
      // 2440587.5 is the JD for Jan 1, 1970
      const jd = (now.getTime() / 86400000) + 2440587.5;
      
      // Known New Moon reference: Jan 6, 2000 (JD 2451550.1)
      const newMoonRef = 2451550.1; 
      const lunarCycle = 29.53058867;
      
      let daysSince = jd - newMoonRef;
      let phase = (daysSince % lunarCycle) / lunarCycle;

      // Handle negative results from the modulo
      if (phase < 0) phase += 1;

      let emoji = '🌑';
      let desc = 'New Moon';

      // Phase mapping (0.0 to 1.0)
      if (phase < 0.03 || phase > 0.97) {
        emoji = '🌑'; desc = 'New Moon';
      } else if (phase < 0.22) {
        emoji = '🌒'; desc = 'Waxing Crescent';
      } else if (phase < 0.28) {
        emoji = '🌓'; desc = 'First Quarter';
      } else if (phase < 0.47) {
        emoji = '🌔'; desc = 'Waxing Gibbous';
      } else if (phase < 0.53) {
        emoji = '🌕'; desc = 'Full Moon';
      } else if (phase < 0.72) {
        emoji = '🌖'; desc = 'Waning Gibbous';
      } else if (phase < 0.78) {
        emoji = '🌗'; desc = 'Last Quarter';
      } else {
        emoji = '🌘'; desc = 'Waning Crescent';
      }

      document.getElementById('moon-emoji').innerText = emoji;
      document.getElementById('moon-desc').innerText = desc;
    }

    // Run moon calculation immediately and refresh every 15 mins
    getMoonPhase();
    setInterval(getMoonPhase, 900000);

    // Weather from wttr.in
    function fetchWeather(locationQuery) {
      const url = `https://wttr.in/${locationQuery}?format="%c %t(%F) %h %w(mph) %p\n"&u`;
      fetch(url)
        .then(r => r.text())
        .then(text => {
          let cleaned = text.trim()
            .replace(/"/g, '')
            .replace(/\([^)]*\)/g, '')
            .replace(/\s+/g, ' ')
            .replace(/mm/g, '')
            .replace(/0.0/g, '0')
            .replace(/Rocklin:/g, '') 
            .trim();

          document.getElementById('weather').innerText = cleaned || 'No weather data';
        })
        .catch(() => {
          document.getElementById('weather').innerText = 'Weather load failed';
        });
    }

    // GPS / IP Fallback
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(4);
          const lon = position.coords.longitude.toFixed(4);
          fetchWeather(`${lat},${lon}`);
        },
        () => {
          fetchWeather(''); // Fallback to IP
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    } else {
      fetchWeather('');
    }
  </script>
</body>
</html>
