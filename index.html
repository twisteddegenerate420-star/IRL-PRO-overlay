<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Truck Overlay PRO</title>
    <style>
        body, html { margin: 0; padding: 0; background: transparent !important; color: #32CD32; font-family: 'Courier New', Courier, monospace; text-shadow: 2px 2px 2px #000; overflow: hidden; }
        #container { position: absolute; bottom: 20px; left: 20px; }
        #greeting-box { color: #FFD700; font-size: 22px; font-weight: 900; font-style: italic; margin-bottom: 5px; }
        .timestamp { font-size: 30px; font-weight: 900; margin-bottom: 5px; }
        #weather-line { font-size: 22px; font-weight: bold; margin-bottom: 2px; }
        #fuel-line { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #moon-line { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: bold; }
        #moon-emoji { font-size: 32px; }
        .cold { color: #00BFFF !important; }
        .hot { color: #FF4500 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="greeting-box">🚛 <span id="greeting-text">Welcome In Mother Truckers</span></div>
        <div class="timestamp" id="datetime">LOADING...</div>
        <div id="weather-line"><span id="temp-display">Initializing GPS...</span></div>
        <div id="fuel-line">⛽ Nat'l Diesel Avg: $3.71</div>
        <div id="moon-line"><span id="moon-emoji"></span><span id="moon-desc"></span></div>
    </div>
    <script>
        const CONFIG = {
            WEATHER_REFRESH: 600000,
            CLOCK_REFRESH: 1000,
            LUNAR_EPOCH: new Date('2026-02-17T12:01:00Z'),
            SYNODIC_MONTH: 29.530588 * 24 * 60 * 60 * 1000
        };

        function updateClock() {
            document.getElementById('datetime').innerText = new Date().toLocaleString();
        }

        async function fetchWeather() {
            const display = document.getElementById('temp-display');
            const line = document.getElementById('weather-line');
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
                    const data = await res.json();
                    const temp = Math.round(data.current.temperature_2m);
                    const lookup = { 0: ["☀️", "Clear"], 1: ["🌤️", "Mainly Clear"], 2: ["⛅", "Partly Cloudy"], 3: ["☁️", "Overcast"], 45: ["🌫️", "Foggy"], 51: ["🌧️", "Drizzle"], 61: ["🌧️", "Rain"], 71: ["❄️", "Snow"], 80: ["🌦️", "Showers"] };
                    const [icon, desc] = lookup[data.current.weather_code] || ["🌤️", "Cloudy"];
                    display.innerText = `${icon} ${temp}°F ${desc}`;
                    line.className = (temp <= 32) ? 'cold' : (temp >= 85) ? 'hot' : '';
                } catch (e) { display.innerText = "Weather Sync Error"; }
            }, null, { enableHighAccuracy: true });
        }

        function calculateLunarPhase() {
            const diff = (new Date().getTime() - CONFIG.LUNAR_EPOCH.getTime()) % CONFIG.SYNODIC_MONTH;
            const phase = diff / CONFIG.SYNODIC_MONTH;
            const map = [
                { t: 0.03, e: '🌑', d: 'New Moon' }, { t: 0.22, e: '🌒', d: 'Waxing Crescent' },
                { t: 0.28, e: '🌓', d: 'First Quarter' }, { t: 0.47, e: '🌔', d: 'Waxing Gibbous' },
                { t: 0.53, e: '🌕', d: 'Full Moon' }, { t: 0.72, e: '🌖', d: 'Waning Gibbous' },
                { t: 0.78, e: '🌗', d: 'Last Quarter' }, { t: 1.00, e: '🌘', d: 'Waning Crescent' }
            ];
            const match = map.find(p => phase <= p.t) || map[0];
            document.getElementById('moon-emoji').innerText = match.e;
            document.getElementById('moon-desc').innerText = match.d;
        }

        updateClock(); fetchWeather(); calculateLunarPhase();
        setInterval(updateClock, CONFIG.CLOCK_REFRESH);
        setInterval(fetchWeather, CONFIG.WEATHER_REFRESH);
        setInterval(calculateLunarPhase, 86400000);
    </script>
</body>
</html>
