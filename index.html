<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Truck Overlay - Mother Trucker Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0; 
            background: transparent !important; 
            color: #32CD32; /* Lime Green */
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 2px 2px 2px #000;
            overflow: hidden;
        }
        #container { position: absolute; bottom: 20px; left: 20px; }
        
        #greeting-box { 
            color: #FFD700; 
            font-size: 22px; 
            font-weight: 900; 
            font-style: italic; 
            margin-bottom: 5px; 
            min-height: 30px; 
        }
        
        @keyframes holidayPulse {
            0% { text-shadow: 2px 2px 2px #000; transform: scale(1); }
            50% { text-shadow: 0 0 15px #FFD700, 0 0 5px #FFF; transform: scale(1.03); color: #FFFACD; }
            100% { text-shadow: 2px 2px 2px #000; transform: scale(1); }
        }

        .holiday-active { display: inline-block; animation: holidayPulse 2s infinite ease-in-out; }
        .timestamp { font-size: 30px; font-weight: 900; margin-bottom: 5px; }
        #weather-line { font-size: 22px; font-weight: bold; margin-bottom: 2px; }
        #fuel-line { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #moon-line { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: bold; }
        #moon-emoji { font-size: 32px; }
    </style>
</head>
<body>

    <div id="container">
        <div id="greeting-box">🚛 <span id="greeting-text">Welcome In Mother Truckers</span></div>
        <div class="timestamp" id="datetime">LOADING...</div>
        <div id="weather-line">
            <span id="temp-display">🌤️ Fetching Weather...</span>
        </div>
        <div id="fuel-line">⛽ Nat'l Diesel Avg: <span id="fuel-price">$3.71</span></div>
        <div id="moon-line">
            <span id="moon-emoji">🌒</span>
            <span id="moon-desc">Waxing Crescent</span>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('datetime').innerText = now.toLocaleString();
            checkHoliday(now);
        }

        function checkHoliday(now) {
            const m = now.getMonth();
            const d = now.getDate();
            const hr = now.getHours();
            const min = now.getMinutes();
            const greetingEl = document.getElementById('greeting-text');
            let msg = "Welcome In Mother Truckers";

            // 10-4 Easter Egg
            if ((hr === 10 || hr === 22) && min === 4) {
                msg = "10-4 Mother Truckers!! 🚛💨";
                greetingEl.classList.add('holiday-active');
            } else {
                const hData = {
                    '0-1':   { name: "New Year's Day", icon: "✦" },
                    '1-14':  { name: "Valentine's Day", icon: "❤" },
                    '2-17':  { name: "St. Patrick's Day", icon: "☘" },
                    '4-10':  { name: "Mother's Day", icon: "💐" },
                    '4-25':  { name: "Memorial Day", icon: "🎖️" },
                    '5-21':  { name: "Father's Day", icon: "👨‍👦" },
                    '6-4':   { name: "Independence Day", icon: "✷" },
                    '8-7':   { name: "Labor Day", icon: "🛠️" },
                    '9-4':   { name: "National Truckers Day", icon: "🚛" },
                    '9-31':  { name: "Halloween", icon: "☠" },
                    '10-11': { name: "Veterans Day", icon: "✪" },
                    '10-26': { name: "Thanksgiving", icon: "🦃" },
                    '11-7':  { name: "Pearl Harbor Day", icon: "⚓" },
                    '11-25': { name: "Christmas Day", icon: "🎄" },
                    '11-31': { name: "New Year's Eve", icon: "🎆" }
                };
                
                if (m === 8 && d >= 13 && d <= 19) {
                    msg = "🚚 Happy Trucker Appreciation Week!";
                } else {
                    let holiday = hData[`${m}-${d}`];
                    if (holiday) { msg = `${holiday.icon} Happy ${holiday.name}`; }
                }
                msg !== "Welcome In Mother Truckers" ? greetingEl.classList.add('holiday-active') : greetingEl.classList.remove('holiday-active');
            }
            greetingEl.innerText = msg;
        }

        function fetchWeather(city = "Chicago") {
            fetch(`https://wttr.in/${city}?format=%c%t+%C`)
                .then(res => res.text())
                .then(data => {
                    const cleanData = data.replace('+', '').trim();
                    if(cleanData.length > 0) document.getElementById('temp-display').innerText = cleanData;
                })
                .catch(() => { document.getElementById('temp-display').innerText = "🌤️ 21°F Partly cloudy"; });
        }

        function fetchFuelPrice() {
            fetch('https://wttr.in/fuel+diesel?format=%P')
                .then(res => res.text())
                .then(price => {
                    const cleanPrice = parseFloat(price);
                    // GUARDRAIL: Only update if the price is realistic (under $10)
                    if(!isNaN(cleanPrice) && cleanPrice > 2 && cleanPrice < 10) {
                        document.getElementById('fuel-price').innerText = "$" + cleanPrice.toFixed(2);
                    } else {
                        document.getElementById('fuel-price').innerText = "$3.71";
                    }
                })
                .catch(() => { document.getElementById('fuel-price').innerText = "$3.71"; });
        }

        function getMoonPhase() {
            const now = new Date();
            const lp = 2551442.8; 
            const new_moon = new Date('1970-01-07T20:35:00Z');
            const phase = ((now.getTime() - new_moon.getTime()) / 1000) % lp;
            const res = phase / lp;
            let emoji, desc;

            if (res < 0.02 || res > 0.98) { emoji = '🌑'; desc = 'New Moon'; }
            else if (res < 0.2501) { emoji = '🌒'; desc = 'Waxing Crescent'; } 
            else if (res < 0.27) { emoji = '🌓'; desc = 'First Quarter'; } 
            else if (res < 0.48) { emoji = '🌔'; desc = 'Waxing Gibbous'; }
            else if (res < 0.52) { emoji = '🌕'; desc = 'Full Moon'; }
            else if (res < 0.73) { emoji = '🌖'; desc = 'Waning Gibbous'; }
            else if (res < 0.77) { emoji = '🌗'; desc = 'Last Quarter'; }
            else { emoji = '🌘'; desc = 'Waning Crescent'; }

            document.getElementById('moon-emoji').innerText = emoji;
            document.getElementById('moon-desc').innerText = desc;
        }

        updateClock(); fetchWeather(); getMoonPhase(); fetchFuelPrice();
        setInterval(updateClock, 1000);
        setInterval(fetchWeather, 900000);
        setInterval(getMoonPhase, 600000);
        setInterval(fetchFuelPrice, 43200000);
    </script>
</body>
</html>
